<!doctype html>
<html lang="en">
<head><script>
  (() => {
    const param = new URLSearchParams(window.location.search).get("scoutTheme");
    const theme =
      param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<style>
:root {
  color-scheme: light;
  --cp-bg: #f7f4ef;
  --cp-bg-elevated: #fcfbf8;

  --cp-success: #16a34a;
  --cp-danger: #dc2626;
  --cp-warning: #f59e0b;

  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
  --cp-overlay: rgba(255, 255, 255, 0.8);

}
html[data-theme="dark"] {
  color-scheme: dark;

  --cp-success: #4ade80;
  --cp-danger: #f87171;

  --cp-highlight: rgba(253, 142, 161, 0.12);
}
</style>

<body>
  <canvas id="c"></canvas>
  <svg id="leaders" aria-hidden="true"></svg>
  <div id="ui"></div>
  <div id="loader">
    <div class="loader-inner">
      <div class="loader-logo">SILO</div>
      <div class="loader-sub">144 levels · cut open · interactive 3D</div>
      <div class="loader-bar"><div class="loader-fill" id="loader-fill"></div></div>
      <div class="loader-text" id="loader-text">Pouring concrete…</div>
    </div>
  </div>
<div id="game-loading">
  <div class="game-loading-card">
    <strong>SILO RUN</strong>
    <div class="game-loading-indicator" aria-hidden="true"></div>
    <span>Preparing Silo 18</span>
  </div>
</div><div id="game-hud">
  <div class="game-brand"><strong>SILO RUN</strong><span id="game-level">LEVEL 68</span></div>

<div id="game-crosshair" aria-hidden="true"></div>
<button id="game-enter" type="button"><strong>Enter Silo 18</strong><span>Click to capture the mouse</span></button>
<div id="game-status" role="status"></div>
<aside id="quest-tracker" class="show">
  <button id="quest-summary" type="button" aria-expanded="false">
    <span class="quest-summary-label">QUESTS · CLICK TO EXPAND</span>

  </button>
  <div id="quest-list" hidden></div>
</aside>
<div id="quest-prompt"></div>

</section>

    <button id="mobile-interact" type="button">ACT</button>
